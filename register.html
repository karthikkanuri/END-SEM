<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Register</h1>
    <p class="sub">Create a new account.</p>
    <form id="registerForm" novalidate>
      <label for="regName">Full name</label>
      <input type="text" id="regName" placeholder="Your name" autocomplete="name">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="At least 6 characters" autocomplete="new-password">
      <label for="regConfirm">Confirm password</label>
      <input type="password" id="regConfirm" placeholder="Repeat password" autocomplete="new-password">
      <div class="msg" id="regMsg" role="alert"></div>
      <button type="submit">Register</button>
    </form>
    <div class="switch">Already registered? <a href="index.html">Back to login</a></div>
  </div>
  <script src="js/auth.js"></script>
  <script>initRegisterPage();</script>
</body>
</html>
