<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <p class="sub">Sign in to your account.</p>
    <form id="loginForm" novalidate>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
      <div class="msg" id="loginMsg" role="alert"></div>
      <button type="submit">Login</button>
    </form>
    <div class="switch">New user? <a href="register.html">Create an account</a></div>
  </div>
  <script src="js/auth.js"></script>
  <script>initLoginPage();</script>
</body>
</html>
